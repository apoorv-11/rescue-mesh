# RescueMesh backend — PostgreSQL + app.
# Usage: cp .env.example .env  (adjust secrets), then: docker compose up --build
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rescuemesh}
      POSTGRES_USER: ${POSTGRES_USER:-rescuemesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescuemesh}
      # Keep the classic data directory layout inside the named volume.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rescuemesh} -d ${POSTGRES_DB:-rescuemesh}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rescuemesh}
      DB_USERNAME: ${POSTGRES_USER:-rescuemesh}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rescuemesh}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789abcdef}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # Mail (auth v2) via Resend — empty RESEND_API_KEY = dev mode (codes in the app log).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-RescueMesh <onboarding@resend.dev>}
      # Gateway photos (design §3): verified JPEGs on a named volume.
      PHOTO_DIR: /data/photos
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - photos:/data/photos

volumes:
  pgdata:
  photos:
